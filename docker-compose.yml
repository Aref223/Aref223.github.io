version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+psycopg2://app_user:app_password@db:5432/app_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "worker", "--loglevel=INFO"]
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+psycopg2://app_user:app_password@db:5432/app_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started

  beat:
    build: ./backend
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "beat", "--loglevel=INFO"]
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+psycopg2://app_user:app_password@db:5432/app_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started

  frontend:
    build: ./frontend
    env_file:
      - ./.env
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  db_data: